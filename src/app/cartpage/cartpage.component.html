<mat-toolbar class="header">
<mat-toolbar-row class="header">
        <button class="Title" routerLink="/home">
      <span class="labelHeader" >BOBCAT CLAWS</span>
      </button>

        <button class="home" routerLink="/home">
          <span>HOME</span>
        </button>
        
      <span class="spacer"></span>
  
        

    </mat-toolbar-row>
</mat-toolbar>

<div>
<!-- Products in cart -->
  <li *ngFor="let product of bookmarkedProducts">
<h4>{{ product.Name }}</h4>
<img class="image" [src]="product.Img_URL">
<h4>{{ product.Price }}</h4>
      

<button class="Title" (click)="removeFromCart(product)">
  <span>Remove from cart</span>
</button>

</li>

</div>
