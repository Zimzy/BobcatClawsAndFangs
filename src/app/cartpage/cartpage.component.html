<ul>
  <li
    class="product-container"
    *ngFor="let product of cartProcessed; let i = index"
  >
    <!-- Entire row is clickable (back to product page) -->
    <div class="row" [routerLink]="product.Route">
      
      <h5 class="product-link">
        {{ product.Name }}
      </h5>

      <img [src]="product.image_URL">

      <!-- Remove button: DOES NOT navigate -->
      <button
        class="cart-button"
        (click)="removeFromCart(product); $event.stopPropagation()"
        (mousedown)="$event.stopPropagation()"
      >
        <i class="bi bi-x-lg"></i>
      </button>

      <h5>
        Price: {{ product.Currency_symbol }}{{ product.Price }}
      </h5>

      <!-- Qty block: DOES NOT navigate -->
      <div class="cart-qty"
           (click)="$event.stopPropagation()"
           (mousedown)="$event.stopPropagation()">
        
        <label [for]="'qty-' + i">Qty:</label>
        <select
          [id]="'qty-' + i"
          [(ngModel)]="product.Quantity"
          (ngModelChange)="onQuantityChange(product, $event)"
          (click)="$event.stopPropagation()"
          (mousedown)="$event.stopPropagation()"
        >
          <option *ngFor="let q of quantities" [value]="q">
            {{ q }}
          </option>
        </select>
      </div>

      <h5>
        Item total:
        {{ product.Currency_symbol }}{{ product.Price * (product.Quantity || 1) }}
      </h5>

    </div>
  </li>
</ul>


<div class="cart-footer">
  <h5 class="bottom">Subtotal: {{priceSum()}}</h5>
  <button class="landing-btn sign-in" (click)="printPage()">Print Page</button>
</div>
